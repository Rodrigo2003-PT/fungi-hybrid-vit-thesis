# external_validation_config.yaml
# -----------------------------------------------------------------------------
# External validation configuration for the frozen LSA-ConvTok Hybrid model.
#
# Consumed by:
#   - external_manifest.py
#   - audit_external_tiffs.py
#   - preprocess_external.py
#   - load_frozen_hybrid.py
#   - evaluate_external_generalization.py
#   - external_statistics.py
#   - compare_external_pipelines.py (via the runner)
#   - run_external_validation_colab_local.py
#
# Scientific principle:
#   The external dataset is an acquisition-domain validation set, not an
#   extension of the training data. No training, fine-tuning, threshold tuning
#   or model selection is performed on these data.
#
# Pre-specification status:
#   The locked primary pipeline was specified before the external results were
#   seen. Later changes are listed under `amendments` with their post hoc
#   status; this file as a whole is therefore NOT a purely pre-specified
#   protocol.
#
# Optical geometry:
#   Optical acquisition primitives live only in external_validation_metadata.json
#   (`optics`). This config holds the validation policy, never spacing values.
# -----------------------------------------------------------------------------

schema_version: "2.0"
project:
  name: "External Validation of the LSA-ConvTok Hybrid Model Under Microscope-Domain Shift"
  author: "Rodrigo Sá"
  year: 2026
  dataset_role: "external_validation"
  domain_name: "external_new_microscope"
  primary_scientific_question: >
    Does the frozen Hybrid SimpleViT_LSA_ConvTok model, trained entirely on
    the original 12-bit microscope domain, maintain slide-level diagnostic
    performance on an independent 14-bit microscope domain without retraining,
    fine-tuning, threshold tuning, or model selection?

amendments:
  - date: "2026-11-08"
    change: >
      Post hoc physical-scale resampling sensitivity analysis retired; all
      stored spacing values and spacing ratios removed from config and
      metadata; optics block (schema 2.0) and optics validation introduced.
    reason: >
      The external spacing previously recorded was the unbinned sensor value
      applied to 2x2-reduced images (off by a factor of about 2.02), so the
      analysis did not test what it claimed.
    post_hoc: true
  - date: "2026-11-08"
    change: "Photometric mean/std sensitivity analysis documented as post hoc."
    reason: "Added after the primary locked result was observed; diagnostic only."
    post_hoc: true

# -----------------------------------------------------------------------------
# Input data and metadata files
# -----------------------------------------------------------------------------
inputs:
  raw_dataset:
    # ZIP archive or extracted directory with fungi/<species>/ subfolders.
    path: "data/fungi.zip"
    expected_format: "TIFF"
    expected_extensions: [".tif", ".tiff", ".TIF", ".TIFF"]
  external_metadata_json:
    path: "configs/external_validation_metadata.json"

# -----------------------------------------------------------------------------
# Checkpoint artifacts
# -----------------------------------------------------------------------------
checkpoints:
  primary_inference_checkpoint:
    path: "models/final_model_lsa_convtok.pth"
    role: "primary_frozen_inference_artifact"
  provenance_checkpoint:
    path: "models/final_model_checkpoint.pth"
    role: "training_resume_provenance_artifact"
    required: false
  expected_model:
    model_variant: "SimpleViT_LSA_ConvTok"
    experiment_name: "lsa_convtok"
    architecture_hash: "95ace50634b621d7"
    image_size: 384
    channels: 1
    num_classes: 2
    checkpoint_mean: [0.23691008985042572]
    checkpoint_std: [0.007409718818962574]
  validation_policy:
    # Identity is established by stored arch_metadata, by recomputing
    # training_logic.compute_arch_hash(embedded config), or by the provenance
    # checkpoint's arch_metadata; any mismatch aborts strict runs.
    validate_architecture_hash: true
    abort_on_architecture_mismatch: true
    refuse_mean_std_fallback_in_strict_mode: true
    compare_primary_and_provenance_weights_if_available: true
    compare_primary_and_provenance_mean_std_if_available: true
    set_eval_mode: true
    disable_gradients: true

# -----------------------------------------------------------------------------
# Class labels and biological annotation policy
# -----------------------------------------------------------------------------
labels:
  class_names:
    - "Candida albicans"
    - "Candida glabrata"
  class_to_index:
    "Candida albicans": 0
    "Candida glabrata": 1
  index_to_class:
    0: "Candida albicans"
    1: "Candida glabrata"
  slide_id_parsing:
    filename_pattern_description: >
      Each image filename contains acquisition date, species acronym, slide
      letter and image index, for example 20260507_gla_A_1.tif.
    expected_parts: ["acquisition_date", "species_code", "slide_letter", "image_index"]
    slide_id_format: "{acquisition_date}_{species_code}_{slide_letter}"
    species_codes:
      alb: "Candida albicans"
      gla: "Candida glabrata"
  morphology_subgroups:
    albicans_hyphae_status_values: ["hyphae", "no_hyphae"]
    glabrata_hyphae_status: "not_applicable"
    use_hyphae_as_class_label: false

# -----------------------------------------------------------------------------
# Expected external-validation cohort structure
# -----------------------------------------------------------------------------
expected_external_cohort:
  total_slides: 24
  slides_per_species:
    "Candida albicans": 12
    "Candida glabrata": 12
  albicans_morphology_counts:
    hyphae: 5
    no_hyphae: 7
  expected_images_per_slide:
    approximate_mean: 62
    acceptable_minimum_for_audit_warning: 20
    acceptable_maximum_for_audit_warning: 100
  expected_acquisition_window:
    # Slides dated outside this window are flagged (PARTIAL: 20200528_alb_A).
    start: "20260501"
    end: "20260531"
  split_policy:
    create_train_test_split: false

# -----------------------------------------------------------------------------
# Descriptive acquisition-domain metadata (no optical geometry here)
# -----------------------------------------------------------------------------
training_domain_reference:
  microscope: "Zeiss Axio Observer"
  camera: "Prime 95B, monochrome"
  objective: "Plan-Apochromat 63x/1.4 Oil"
  illumination: "Brightfield, TL LED, 10%"
  software: "ZEN Blue"
  exposure_time_ms: 10
  bit_depth: 12
  sampling_strategy: >
    Random image fields per slide; approximately 62 images per slide; focus
    manually optimized per slide and then kept constant.
  calibration: "No calibration performed"

external_domain:
  microscope: "Zeiss Axio Observer.Z1"
  camera: "Axiocam 820, monochrome"
  objective: "Plan-Apochromat 63x/1.4 Oil"
  illumination: "Brightfield, TL LED, 20%"
  software: "ZEN Blue"
  exposure_time_ms: 50
  bit_depth_reported_by_lab: 14
  sample_preparation: "Agar pad technique using 1.7% agarose and 5 µL culture"
  sampling_strategy: >
    Images acquired from random areas of each slide; approximately 62 images
    per slide; focus manually optimized per slide and then kept constant.
  calibration: "No calibration performed"

domain_shift:
  treat_as_external_domain_shift: true
  shift_factors:
    - "camera_sensor_and_binning"
    - "bit_depth_photometric_scale"
    - "illumination_exposure"
    - "resize_decimation_factor"
    - "acquisition_date_batch_confounded_with_species"
    - "possible_morphology_distribution_shift"
  training_to_external_bit_depth:
    training_bit_depth: 12
    external_reported_bit_depth: 14
    rule: >
      The checkpoint training bit depth documents the original domain only. It
      must not force 12-bit normalization of external TIFFs. External raw TIFFs
      are normalized according to their inferred effective bit depth (14-bit).
  optical_geometry_interpretation: >
    Derived from the metadata optics block: after the pixel-locked resize to
    384 px, external and training images are sampled at about 0.511 and 0.546
    um per network-input pixel (fields of view about 196 and 210 um), so the
    residual geometric difference is about 7%. The resize kernel matches
    training (cv2.INTER_LANCZOS4), but the decimation factor differs (5.875
    vs 3.125) and the external binning mode is unknown.

# -----------------------------------------------------------------------------
# Optics validation policy (values live in the metadata optics block)
# -----------------------------------------------------------------------------
optics_validation:
  source: "external_validation_metadata.json:optics"
  rules:
    O-1: "All primitives present, finite, positive; no AUTHOR_TO_* placeholders (strict runs)."
    O-2: "stored_image_px == sensor_native_px / binning_factor."
    O-3: "Relative error between derived and header pixel spacing <= tolerances.spacing_rel."
    O-4: "Per-image TIFF calibration (ImageJ unit + XResolution, OME, TIFF ResolutionUnit) agrees with derived spacing."
    O-5: "Per-image shape equals optics.external.stored_image_px."
    O-6: "binning_mode == unknown is logged as a provenance gap."
  calibration_tag_priority: ["imagej_unit_XResolution", "ome_PhysicalSize", "tiff_ResolutionUnit_XResolution"]

# -----------------------------------------------------------------------------
# TIFF audit policy
# -----------------------------------------------------------------------------
tiff_audit:
  required_before_preprocessing: true
  expected_single_channel: true
  expected_external_effective_bit_depth: 14
  expected_container_bit_depths: [14, 16]
  supported_bit_depths: [8, 12, 14, 16]
  status_semantics: >
    audit_info holds expected conditions (e.g. values above 4095 in 14-bit
    data); audit_warnings is reserved for anomalies; audit_errors fail the image.
  abort_conditions:
    non_tiff_file_detected: true
    unreadable_or_corrupt_file: true
    non_single_channel_image: true
    shape_differs_from_optics: true
    header_spacing_disagrees_with_optics: true
    missing_slide_id_in_metadata: true
    mixed_species_labels_within_slide: true
    values_above_16383: true

# -----------------------------------------------------------------------------
# Photometric sensitivity-analysis policy
# -----------------------------------------------------------------------------
photometric_sensitivity:
  scientific_role: "post_hoc_photometric_mean_std_sensitivity_not_primary"
  enabled_for_final_diagnostic_run: true
  mode_name: "photometric_mean_std_matched_pipeline"
  rationale: >
    Added after the primary locked result showed that external inputs are
    strongly shifted relative to the frozen training-domain normalization
    statistics (see amendments). Tests whether global photometric mismatch
    plausibly contributes to the external-domain failure.
  harmonization_method: "per_image_linear_mean_std_matching_to_frozen_checkpoint_statistics"
  transformation: >
    For each resized external image x in [0, 1]: y = ((x - mean(x)) / std(x))
    * checkpoint_std + checkpoint_mean, clipped to [0, 1]. The Dataset still
    applies the frozen checkpoint mean/std before inference.
  external_information_used:
    labels_used: false
    predictions_used: false
    performance_used_to_define_transform: false
    per_image_unlabeled_intensity_statistics_used: true
  numerical_safety:
    min_source_std: 0.000001
    post_harmonization_clip_to_unit_interval: true
  target_statistic_caveat: >
    PARTIAL: whether checkpoint_std is a pooled dataset-level statistic or an
    average per-image statistic is not verified; if pooled, per-image matching
    can over-contrast images relative to typical training images.
  report_as_primary_external_validation: false

# -----------------------------------------------------------------------------
# Preprocessing policy
# -----------------------------------------------------------------------------
preprocessing:
  primary_mode: "locked_pixel_pipeline"
  sensitivity_modes:
    - "photometric_mean_std_matched_pipeline"
  resize_kernel:
    external: "cv2.INTER_LANCZOS4 on float32"
    training: "cv2.INTER_LANCZOS4 on float32 (author-verified: simpleViT_fungi data/preprocessing.py::resize_and_preprocess_image)"
    kernel_matches_training: true
    antialiasing: false
    limitation: >
      Identical kernel, different decimation factor (external 2256 -> 384,
      training 1200 -> 384); aliasing/noise texture can differ by domain.
  post_resize_clipping:
    enabled_by_default: true
    rule: "clip non-standardized float32 arrays to [0.0, 1.0] after interpolation and before checkpoint standardization"
    applies_to_modes:
      - "locked_pixel_pipeline"
      - "photometric_mean_std_matched_pipeline"
  reuse_policy: >
    Existing .npy outputs are reused only when preprocessing_fingerprint.json
    matches the requested parameters; otherwise --force or a new directory is
    required.
  available_modes:
    locked_pixel_pipeline:
      primary_or_sensitivity: "primary"
      raw_bit_depth_policy: "infer_from_tiff_audit_expected_14bit"
      normalization_denominator_policy: "2^inferred_effective_bit_depth - 1"
      expected_normalization_denominator: 16383
      resize_policy: "pixel_locked_resize_to_model_image_size"
      output_dtype: "float32"
      output_range_before_checkpoint_standardization: [0.0, 1.0]
      apply_training_checkpoint_mean_std_in_dataset: true
      image_size: 384
    photometric_mean_std_matched_pipeline:
      primary_or_sensitivity: "post_hoc_sensitivity"
      raw_bit_depth_policy: "infer_from_tiff_audit_expected_14bit"
      normalization_denominator_policy: "2^inferred_effective_bit_depth - 1"
      expected_normalization_denominator: 16383
      photometric_policy: "per_image_mean_std_match_to_frozen_checkpoint_statistics"
      resize_policy: "pixel_locked_resize_to_model_image_size"
      output_dtype: "float32"
      output_range_before_checkpoint_standardization: [0.0, 1.0]
      apply_training_checkpoint_mean_std_in_dataset: true
      image_size: 384
  checkpoint_standardization:
    use_checkpoint_mean_std: true
    apply_after_raw_linear_normalization_and_resize: true
    do_not_recompute_mean_std_on_external_set_for_primary: true

# -----------------------------------------------------------------------------
# Inference and evaluation policy
# -----------------------------------------------------------------------------
inference:
  batch_size: 64
  num_workers: 2
  precision: "float32"
  precision_note: "Training validation used CUDA autocast; external inference runs in float32 (documented, not corrected)."
  no_grad: true
  shuffle: false
  deterministic_order: true

evaluation:
  primary_unit: "slide"
  secondary_unit: "image"
  slide_aggregation:
    primary_rule: "mean_probability"
    formula: "p_slide,c = mean_i(p_image_i,c); y_slide = argmax_c(p_slide,c)"
    tune_aggregation_rule_on_external_data: false
    training_rule_consistency: "PARTIAL: training_utils.compute_slide_level_metrics rule not inspected"
  threshold_policy:
    tune_threshold_on_external_data: false
    binary_decision_rule: "argmax_mean_slide_probability"
  primary_slide_level_metrics:
    - "balanced_accuracy"
    - "accuracy"
    - "matthews_corrcoef"
    - "weighted_f1"
    - "auroc"
    - "sensitivity_per_class"
    - "specificity_per_class"
    - "confusion_matrix"
  interval_methods:
    accuracy_and_recall: "clopper_pearson_exact"
    auroc: "delong_wald"
    other_metrics: "class_stratified_percentile_bootstrap_with_degeneracy_flag"
  bootstrap_confidence_intervals:
    enabled: true
    resampling_unit: "slide"
    n_bootstrap: 10000
    confidence_level: 0.95
    seed: 42
    stratify_by_class: true
    do_not_bootstrap_images_independently: true
  calibration:
    enabled: true
    primary_interpretation: "descriptive"
    do_not_fit_calibration_on_external_labels_for_primary: true
    metrics: ["brier_score", "expected_calibration_error", "confidence_correct_vs_incorrect"]
  subgroup_analysis:
    enabled: true
    subgroups:
      - "Candida albicans with hyphae"
      - "Candida albicans without hyphae"
      - "Candida glabrata"
      - "acquisition_date (descriptive, confounding transparency)"

# -----------------------------------------------------------------------------
# Output paths (the runner writes under outputs.root_dir)
# -----------------------------------------------------------------------------
outputs:
  root_dir: "outputs_external_v2"
  manifest_dir: "outputs_external_v2/manifest"
  audit_dir: "outputs_external_v2/audit"
  preprocessing_sidecar_dir: "outputs_external_v2/preprocessing_sidecars"
  evaluation:
    locked_pixel_pipeline_dir: "outputs_external_v2/evaluation/locked_pixel_pipeline"
    photometric_mean_std_matched_pipeline_dir: "outputs_external_v2/evaluation/photometric_mean_std_matched_pipeline"
  statistics:
    locked_pixel_pipeline_dir: "outputs_external_v2/statistics/locked_pixel_pipeline"
    photometric_mean_std_matched_pipeline_dir: "outputs_external_v2/statistics/photometric_mean_std_matched_pipeline"
    multi_pipeline_comparison_dir: "outputs_external_v2/statistics/multi_pipeline_comparison"
  preserved_previous_root: "outputs_external (historical; never modified by code)"

# -----------------------------------------------------------------------------
# Reproducibility and safety rules
# -----------------------------------------------------------------------------
reproducibility:
  random_seed: 42
  deterministic_preprocessing: true
  deterministic_inference_order: true
  save_config_snapshot_to_outputs: true
  record_git_commit_and_package_versions: true
  verification_script: "scripts/verify_refactored_pipeline.py"

scientific_guardrails:
  no_retraining_on_external_data: true
  no_fine_tuning_on_external_data: true
  no_threshold_tuning_on_external_data: true
  no_model_selection_on_external_data: true
  no_preprocessing_selection_based_on_best_external_performance: true
  no_train_test_split_of_external_dataset: true
  keep_sensitivity_analyses_separate_from_primary: true
  report_photometric_sensitivity_as_diagnostic_only: true
  report_slide_level_metrics_as_primary: true
  report_image_level_metrics_as_secondary_only: true
  explicitly_report_12bit_training_vs_14bit_external: true
  report_true_optical_geometry: true
  report_acquisition_date_confounding: true
  discuss_uncertainty_due_to_24_independent_slides: true

# -----------------------------------------------------------------------------
# Script execution order (the runner executes exactly these steps)
# -----------------------------------------------------------------------------
execution_order:
  - step: 0
    name: "verify_refactored_pipeline"
    script: "verify_refactored_pipeline.py"
    command: "python scripts/verify_refactored_pipeline.py --project-config configs/external_validation_config.yaml --project-metadata configs/external_validation_metadata.json"
  - step: 1
    name: "create_external_manifest"
    script: "external_manifest.py"
  - step: 2
    name: "audit_raw_tiffs"
    script: "audit_external_tiffs.py"
  - step: 3
    name: "preprocess_primary"
    script: "preprocess_external.py --mode locked_pixel_pipeline"
  - step: 4
    name: "evaluate_primary"
    script: "evaluate_external_generalization.py --preprocessing-mode locked_pixel_pipeline"
  - step: 5
    name: "statistics_primary"
    script: "external_statistics.py"
  - step: 6
    name: "preprocess_photometric_sensitivity"
    script: "preprocess_external.py --mode photometric_mean_std_matched_pipeline"
    sensitivity_analysis: true
  - step: 7
    name: "evaluate_photometric_sensitivity"
    script: "evaluate_external_generalization.py --preprocessing-mode photometric_mean_std_matched_pipeline"
    sensitivity_analysis: true
  - step: 8
    name: "statistics_photometric_sensitivity"
    script: "external_statistics.py"
    sensitivity_analysis: true
  - step: 9
    name: "compare_primary_vs_sensitivity"
    script: "compare_external_pipelines.py --comparison photometric_mean_std_matched_pipeline=<slide_predictions.csv>"
    sensitivity_analysis: true
execution_order_note: "run_external_validation_colab_local.py --dry-run prints every command with its exact arguments."
